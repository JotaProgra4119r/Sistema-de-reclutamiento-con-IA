<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tester API TalentMosaic</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .step { border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px; }
        h1 { color: #2c3e50; text-align: center; }
        h3 { color: #2980b9; margin-bottom: 10px; }
        button { background-color: #27ae60; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 5px; }
        button:hover { background-color: #2ecc71; }
        pre { background-color: #2c3e50; color: #ecf0f1; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 13px; max-height: 200px; }
        .flex-row { display: flex; gap: 20px; flex-wrap: wrap; }
        .box { background: #fdfdfd; border: 1px solid #ddd; padding: 15px; border-radius: 6px; flex: 1; min-width: 300px;}
    </style>
</head>
<body>

<div class="container">
    <h1>🧪 Tester Completo - TalentMosaic</h1>
    <p style="text-align: center; color: #e74c3c; font-weight: bold;">⚠️ Requisito: Asegúrate de que Uvicorn esté corriendo en la terminal.</p>

    <div class="step flex-row">
        <div class="box">
            <h3>1A. Cargar Freelancers</h3>
            <input type="file" id="fileFree">
            <button onclick="subirArchivo('freelancers', 'fileFree', 'out1A')">Subir Freelancers</button>
            <pre id="out1A">Esperando...</pre>
        </div>
        <div class="box">
            <h3>1B. Cargar Reseñas</h3>
            <input type="file" id="fileRes">
            <button onclick="subirArchivo('resenas', 'fileRes', 'out1B')">Subir Reseñas</button>
            <pre id="out1B">Esperando...</pre>
        </div>
    </div>

    <div class="step">
        <h3>2. Entrenar K-Means</h3>
        <label>Dataset: </label>
        <select id="datasetSelect">
            <option value="freelancers">Freelancers</option>
            <option value="resenas">Reseñas</option>
        </select>
        <label style="margin-left: 15px;">Clusters (k): </label>
        <input type="number" id="kInput" value="4" min="2" max="10" style="width: 50px;">
        <br>
        <button onclick="entrenarModelo()">Entrenar y Segmentar</button>
        <pre id="out2">Esperando acción...</pre>
    </div>

    <div class="step flex-row">
        <div class="box">
            <h3>3. Estadísticas (Freelancers)</h3>
            <button onclick="obtenerStats()">Consultar Stats</button>
            <pre id="out3">Esperando...</pre>
        </div>
        <div class="box">
            <h3>4. Evaluación</h3>
            <button onclick="evaluarModelo()">Calcular Métricas</button>
            <pre id="out4">Esperando...</pre>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000/api";

    async function subirArchivo(endpoint, inputId, outId) {
        const out = document.getElementById(outId);
        const fileInput = document.getElementById(inputId).files[0];
        if (!fileInput) { out.innerText = "Selecciona un archivo CSV primero."; return; }

        out.innerText = "Cargando...";
        const formData = new FormData();
        formData.append("file", fileInput);

        try {
            const res = await fetch(`${API_URL}/upload/${endpoint}`, { method: "POST", body: formData });
            const data = await res.json();
            out.innerText = JSON.stringify(data, null, 2);
        } catch (e) { out.innerText = "Error: " + e.message; }
    }

    async function entrenarModelo() {
        const out = document.getElementById("out2");
        const dataset = document.getElementById("datasetSelect").value;
        const k = document.getElementById("kInput").value;
        out.innerText = `Entrenando ${dataset}...`;
        
        try {
            const res = await fetch(`${API_URL}/cluster`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ dataset: dataset, n_clusters: parseInt(k) })
            });
            const data = await res.json();
            out.innerText = JSON.stringify(data, null, 2);
        } catch (e) { out.innerText = "Error: " + e.message; }
    }

    async function obtenerStats() {
        const out = document.getElementById("out3");
        out.innerText = "Consultando...";
        try {
            const res = await fetch(`${API_URL}/stats/freelancers`);
            const data = await res.json();
            out.innerText = JSON.stringify(data, null, 2);
        } catch (e) { out.innerText = "Error: " + e.message; }
    }

    async function evaluarModelo() {
        const out = document.getElementById("out4");
        out.innerText = "Evaluando...";
        try {
            const res = await fetch(`${API_URL}/evaluacion/freelancers`);
            const data = await res.json();
            out.innerText = JSON.stringify(data, null, 2);
        } catch (e) { out.innerText = "Error: " + e.message; }
    }
</script>
</body>
</html>
